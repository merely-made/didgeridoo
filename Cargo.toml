[workspace]
resolver = "2"
members = [
    "util",
]
default-members = [
    ".",
    "util",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
authors = ["kyren <catherine@kyju.org>"]
license = "MIT"
repository = "https://github.com/kyren/piccolo"

[workspace.dependencies]
ahash = "0.8"
allocator-api2 = "0.2"
anyhow = "1.0"
# The patch-only fork: upstream at the revision above the patch, with its derive
# on syn 3 and synstructure 0.14, so a graph holds one synstructure.
gc-arena = { git = "https://github.com/mark-ik/gc-arena", branch = "main", features = ["allocator-api2", "hashbrown"] }
hashbrown = { version = "0.14", features = ["raw"] }
rand = "0.10"
serde = "1.0"
thiserror = "1.0"

piccolo = { path = "./", version = "0.3.3" }

[package]
name = "piccolo"
description = "Stackless Lua VM implemented in pure Rust"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["random"]
# `math.random` and `math.randomseed`, seeded from system entropy. A host that
# wants repeatable scripts, or a target with no entropy source, leaves this off.
random = ["dep:rand"]

[dependencies]
ahash.workspace = true
allocator-api2.workspace = true
anyhow.workspace = true
gc-arena.workspace = true
hashbrown.workspace = true
rand = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
clap = { version = "4.5", features = ["cargo"] }
rustyline = "14.0"
